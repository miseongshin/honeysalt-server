# api.honeysaltlove.com nginx 설정 사본 — 서버 /etc/nginx/conf.d/api.honeysaltlove.com.conf 와 같게 둔다
# 서버에는 git 이 없어서 여기에 남긴다 · 서버에서 고치면 여기도 고친다
#
# @author shinm
# @since 2026-11-04
# ===========================================================
# DATE              AUTHOR             NOTE
# -----------------------------------------------------------
# 2026-11-04        shinm              최초 생성 — https · 앱 연결
# 2026-11-07        shinm              요청 제한 (429)
# 2026-11-07        shinm              nginx 오류도 { status, code, message } JSON · 보안 헤더(nginx 오류에만) · gzip · http2 · 시간 제한

# 요청 제한 — IP 하나당 1초에 10번 (10m: IP 기록을 담는 메모리 10MB · 약 16만 개)
# conf.d 파일은 nginx 의 http 블록 안에 들어가서 server 바깥 여기에 둔다
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    server_name api.honeysaltlove.com;

    server_tokens off;                  # 오류 화면 · 헤더에 nginx 버전을 보이지 않는다
    client_max_body_size 1m;            # 보낼 수 있는 크기 — 글만 받는다 · 넘으면 413

    # 보안 헤더(HSTS · nosniff)는 앱(Spring Security)이 이미 붙인다 — 여기서 또 붙이면 두 번 나간다
    # nginx 가 직접 내는 오류(아래 @json_*)는 앱을 거치지 않아서 그곳에만 붙인다

    # JSON 응답을 줄여서 보낸다 (작은 응답은 그대로)
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # nginx 가 직접 내는 오류도 앱과 같은 { status, code, message } 로 — Vue · 앱이 한 가지로 받게
    # 앱이 보내는 오류(400 · 401 · 403 · 404 · 409 · 500)는 이미 JSON 이라 건드리지 않고 그대로 지나간다
    error_page 413 = @json_413;
    error_page 429 = @json_429;
    error_page 502 503 504 = @json_503;    # 앱이 꺼짐 · 배포 중 · 너무 늦음 → 모두 503 하나로

    # 앱으로 넘기기
    location / {
        limit_req zone=api burst=20 nodelay;     # 잠깐 몰리는 20번까지는 봐준다 (화면 하나 열 때 API 여러 개)
        limit_req_status 429;                    # 넘으면 429 (기본은 503)

        proxy_pass http://127.0.0.1:8080;                    # 앱 컨테이너
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;          # 앱이 https 로 알아듣게 (forward-headers-strategy)

        proxy_connect_timeout 5s;            # 앱에 붙는 데 5초 넘으면 503
        proxy_read_timeout 30s;              # 앱이 30초 넘게 답이 없으면 503 (기본 60초)
        proxy_send_timeout 30s;
    }

    # 오류 응답 — 앱을 거치지 않으니 보안 헤더를 여기서 붙인다
    location @json_413 {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000 ; includeSubDomains" always;   # 앱(Spring)과 같은 값
        add_header X-Content-Type-Options nosniff always;
        return 413 '{"status":413,"code":"PAYLOAD_TOO_LARGE","message":"Payload too large"}';
    }
    location @json_429 {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000 ; includeSubDomains" always;   # 앱(Spring)과 같은 값
        add_header X-Content-Type-Options nosniff always;
        add_header Retry-After 1 always;     # 1초 뒤에 다시 — 화면이 바로 또 부르지 않게
        return 429 '{"status":429,"code":"TOO_MANY_REQUESTS","message":"Too many requests"}';
    }
    location @json_503 {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000 ; includeSubDomains" always;   # 앱(Spring)과 같은 값
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"status":503,"code":"SERVICE_UNAVAILABLE","message":"Service unavailable"}';
    }

    # certbot 이 넣은 줄 — 손대지 않는다 (인증서 갱신 때 certbot 이 찾는다) · listen 에 http2 만 더했다
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.honeysaltlove.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.honeysaltlove.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# http(80) → https 로 넘기기 — certbot 이 넣은 블록 · 손대지 않는다
server {
    if ($host = api.honeysaltlove.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.honeysaltlove.com;
    server_tokens off;
    return 404; # managed by Certbot
}