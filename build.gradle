plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.honeysaltlove'
version = '0.0.1-SNAPSHOT'
description = 'honeysalt-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'                 // 테이블은 Flyway 가 만든다 (db/migration 의 SQL)
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'     // Flyway 10 부터 PostgreSQL 지원이 따로 나뉘었다
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'   // 테스트 DB 를 컨테이너로 (CI · Jenkins)
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5' //비밀번호 암호화
}

tasks.named('test') {
    useJUnitPlatform()
    // 기본은 local (터널 → love_local) · Jenkins 는 -PtestProfile=test (Testcontainers 가 PostgreSQL 을 잠깐 띄운다)
    systemProperty 'spring.profiles.active', project.findProperty('testProfile') ?: 'local'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    systemProperty "file.encoding", "UTF-8"
}

ext {
    // -Pprofile 이 없으면 local을 기본값으로
    profile = project.findProperty("profile") ?: "local"
}

bootRun {
    systemProperty "spring.profiles.active", profile
}
