# 테스트 전용 설정 (Jenkins · CI) — ./gradlew test -PtestProfile=test
# 비밀값이 없어서 git 에 올린다. 운영 · 개발 설정(application*.yml)은 git 밖이라 CI 에는 없다
# DB 는 Testcontainers 가 테스트할 때 PostgreSQL 15 컨테이너를 띄웠다가 끝나면 지운다 (Docker 가 있어야 한다)

spring:
  datasource:
    url: jdbc:tc:postgresql:15:///honeysalt_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  flyway:
    placeholder-replacement: false            # V 파일의 JSON 에 있는 ${ 를 설정값 자리로 읽지 않게 (application.yml 과 같게)
  security:
    oauth2:
      client:
        registration:
          google:                             # 테스트용 가짜 값 (진짜 키 아님) — 없으면 oauth2Login 이 시작할 때 깨진다
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                      # 테이블은 Flyway 가 만든다 (운영과 같게)
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 100

# 테스트에는 ENC(...) 값이 없어서 마스터 키를 쓰지 않는다 — JasyptConfig 가 값을 꼭 찾아서 아무 값이나 둔다 (진짜 키 아님)
jasypt:
  encryptor:
    password: not-used-in-test
